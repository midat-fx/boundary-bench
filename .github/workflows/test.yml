name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # No model calls here: this checks the benchmark itself, including the no-network sandbox.
      - run: make sandbox-image
      - run: BB_REQUIRE_SANDBOX=1 make test
